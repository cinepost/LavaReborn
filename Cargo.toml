[package]
name = "lava-reborn"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"

[lib]
name = "lava_reborn"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "lava"
path = "src/main.rs"

[dependencies]
ash = "0.38"
anyhow = "1"
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
clap = { version = "4", features = ["derive"] }
glam = { version = "0.29", features = ["serde"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "exr", "hdr"] }
exr = "1.74.2"
intel_tex_2 = "0.5.0"
rayon = "1.12"
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
